name: AMBRAXIS CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: find . -path './node_modules' -prune -o \( -name '*.js' -o -name '*.cjs' \) -type f -exec node --check {} +
      - run: npm test
      - run: npm run build
