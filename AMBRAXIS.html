function gpsFreshness(position,now=Date.now()){
 if(!position)return {key:'none',label:'Sem posição'};
 const age=now-Date.parse(position.recorded_at);
 if(age<0)return {key:'future',label:'Horário futuro'};
 const minutes=Math.floor(age/60000);
 return {key:age<=300000?'recent':'delayed',label:(age<=300000?'Recente':'Atrasada')+' · '+minutes+' min desde a posição'};
}
function csvCell(value){if(value===null||value===undefined)return '""';let text=String(value);if(typeof value==='string'&&/^[\s]*[=+@-]/.test(text))text="'"+text;return '"'+text.replaceAll('"','""')+'"';}
function gpsHistoryCsv(positions){return '\ufeff'+[['Rastreador','Ativo no evento','Horário GPS UTC','Recebido UTC','Latitude','Longitude','Velocidade km/h','Ignição'],...positions.map(p=>[backend.devices.find(d=>d.id===p.device_id)?.fields.name||p.device_id,p.asset_id,p.recorded_at,p.received_at,p.latitude,p.longitude,p.speed,p.ignition===null?'Não informada':p.ignition?'Ligada':'Desligada'])].map(r=>r.map(csvCell).join(';')).join('\r\n');}
async function gpsRefreshPositions(){
 if(!backend.user||backend.gpsPolling)return;
 const csrf=backend.csrf,historyId=backend.historyDeviceId;backend.gpsPolling=true;
 try{const [latest,history]=await Promise.all([backendRequest('positions'),historyId?backendRequest('positions?deviceId='+encodeURIComponent(historyId)):Promise.resolve(null)]);
 if(!backend.user||backend.csrf!==csrf)return;
 backend.positions=latest.positions;if(historyId===backend.historyDeviceId&&history)backend.positionHistory=history.positions;backend.gpsUpdatedAt=Date.now();backend.error='';
 }catch(e){if(backend.user&&backend.csrf===csrf)backend.error='Falha ao atualizar posições: '+e.message;}
 finally{backend.gpsPolling=false;if(backend.user&&backend.csrf===csrf&&st.page==='gps')renderPage();}
}
function gpsPage(){
 const intro=head('Posições recebidas','Consulta de dados enviados à API. Recente e atrasada indicam a idade da posição, sem comprovar conexão física contínua.');
 if(!backend.user)return intro+'<p>Entre em Conta e cadastros para consultar posições.</p>'+linkBtn('Entrar','account');
 const now=Date.now(),headings=['Rastreador','Ativo no evento','Horário GPS','Recebido em','Coordenadas','Velocidade','Ignição','Atualidade','Ações'];
 const display=p=>row([esc(backend.devices.find(d=>d.id===p.device_id)?.fields.name||p.device_id),esc(p.asset_id),esc(new Date(p.recorded_at).toLocaleString('pt-BR')),esc(new Date(p.received_at).toLocaleString('pt-BR')),esc(p.latitude+', '+p.longitude),p.speed===null?'—':esc(p.speed)+' km/h',p.ignition===null?'Não informada':p.ignition?'Ligada':'Desligada',esc(gpsFreshness(p,now).label),`<a class="btn mini" href="https://www.openstreetmap.org/?mlat=${encodeURIComponent(p.latitude)}&mlon=${encodeURIComponent(p.longitude)}#map=16/${encodeURIComponent(p.latitude)}/${encodeURIComponent(p.longitude)}" target="_blank" rel="noopener noreferrer">Ver no mapa</a><button class="btn mini" data-gps-history="${esc(p.device_id)}">Histórico</button>`]);
 const devices=backend.devices.filter(d=>(!backend.gpsDeviceFilter||d.id===backend.gpsDeviceFilter));
 const rows=devices.map(d=>({device:d,position:backend.positions.find(p=>p.device_id===d.id)})).filter(r=>backend.gpsFreshness==='all'||gpsFreshness(r.position,now).key===backend.gpsFreshness).map(({device:d,position:p})=>p?display(p):row([esc(d.fields.name),esc(d.fields.asset),'—','—','—','—','—','Sem posição','Nenhum envio recebido']));
 return intro+`<p role="status" class="hint">${esc(backend.error)}</p><button class="btn" data-gps-refresh ${backend.busy||backend.gpsPolling?'disabled':''}>Atualizar posições</button><label><input type="checkbox" data-gps-auto ${backend.gpsAuto?'checked':''}> Atualizar a cada 15 segundos nesta tela</label><p class="hint">Última consulta concluída: ${backend.gpsUpdatedAt?esc(new Date(backend.gpsUpdatedAt).toLocaleString('pt-BR')):'nenhuma'}. Atualização suspensa fora desta tela ou com a aba oculta. O mapa demonstrativo continua separado.</p><form data-gps-filters><div class="two-grid"><label>Rastreador / ativo atual<select name="deviceId"><option value="">Todos</option>${backend.devices.map(d=>`<option value="${esc(d.id)}" ${backend.gpsDeviceFilter===d.id?'selected':''}>${esc(d.fields.name+' — '+d.fields.asset)}</option>`).join('')}</select></label><label>Atualidade da posição<select name="freshness">${[['all','Todas'],['recent','Recente — até 5 min'],['delayed','Atrasada — mais de 5 min'],['none','Sem posição'],['future','Horário futuro']].map(([k,l])=>`<option value="${k}" ${backend.gpsFreshness===k?'selected':''}>${l}</option>`).join('')}</select></label></div><button class="btn">Aplicar filtros</button></form><p class="hint">Posição antiga recebida agora continua atrasada. Rastreador sem posição não é considerado parado nem online.</p>`+panel('Última posição por rastreador',rows.length?tb(headings,rows):'<p>Nenhuma posição recebida ou nenhum rastreador corresponde aos filtros.</p>')+(backend.positionHistory?panel('Histórico — até 100 posições mais recentes',`<p class="hint">Exporta somente os registros deste histórico, em ordem decrescente de horário GPS. Não representa todo o percurso armazenado.</p><button class="btn mini" data-gps-close-history>Fechar histórico</button><button class="btn mini" data-gps-export>Exportar histórico CSV</button>`+tb(headings,backend.positionHistory.map(display))):'')+(backend.user.role==='admin'?panel('Credencial da integração GPS',`<p>${backend.gpsConfigured?'Existe uma credencial ativa.':'Nenhuma credencial ativa.'} Gere uma credencial e configure seu integrador para enviar POST /api/gps/ingest com Authorization: Bearer e o JSON descrito em INTEGRACAO_GPS.md.</p><p class="hint">Gerar outra credencial invalida a anterior imediatamente. Revogar interrompe novos envios. Não há conexão nativa com protocolos de rastreadores nesta etapa.</p><button class="btn" data-gps-token ${backend.busy?'disabled':''}>Gerar / substituir credencial</button><button class="btn" data-gps-revoke ${backend.busy?'disabled':''}>Revogar credencial</button>${backend.gpsToken?`<p>Copie agora: a credencial completa só é retornada na geração.</p><label>Credencial secreta<textarea readonly rows="3" autocomplete="off">${esc(backend.gpsToken)}</textarea></label><p class="hint">Selecione o campo e copie para o integrador. Ela fica apenas na memória desta página até sair ou recarregar.</p>`:''}`):'');
}
groups[3][1].unshift(['gps','Posições recebidas','location']);menuIndex.gps={title:'Posições recebidas',icon:'location'};pages.gps=gpsPage;
document.addEventListener('click',e=>{
 if(e.target.closest('[data-gps-refresh]'))gpsRefreshPositions();
 if(e.target.closest('[data-gps-token]'))backendPerform(async()=>{const r=await backendRequest('gps/token',{});backend.gpsToken=r.token;backend.gpsConfigured=true;toast('Credencial gerada. Copie para o integrador.');});
 if(e.target.closest('[data-gps-revoke]'))backendPerform(async()=>{await backendRequest('gps/token/revoke',{});backend.gpsToken='';backend.gpsConfigured=false;toast('Credencial revogada.');});
 const history=e.target.closest('[data-gps-history]');if(history)backendPerform(async()=>{const r=await backendRequest('positions?deviceId='+encodeURIComponent(history.dataset.gpsHistory));backend.positionHistory=r.positions;backend.historyDeviceId=history.dataset.gpsHistory;});
 if(e.target.closest('[data-gps-close-history]')){backend.positionHistory=null;backend.historyDeviceId=null;renderPage();}
});
document.addEventListener('change',e=>{if(e.target.matches('[data-gps-auto]')){backend.gpsAuto=e.target.checked;if(backend.gpsAuto)gpsRefreshPositions();}});
document.addEventListener('submit',e=>{const form=e.target.closest('[data-gps-filters]');if(!form)return;e.preventDefault();const values=new FormData(form);backend.gpsDeviceFilter=values.get('deviceId')||'';backend.gpsFreshness=values.get('freshness')||'all';renderPage();});
document.addEventListener('click',e=>{if(e.target.closest('[data-gps-export]')&&backend.user&&backend.positionHistory){const url=URL.createObjectURL(new Blob([gpsHistoryCsv(backend.positionHistory)],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='AMBRAXIS-historico-posicoes.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}});
setInterval(()=>{if(backend.gpsAuto&&backend.user&&st.page==='gps'&&!document.hidden&&!backend.busy)gpsRefreshPositions();},15000);
async function refreshGeofences(){const [g,e]=await Promise.all([backendRequest('geofences'),backendRequest('geofence-events')]);backend.geofences=g.geofences;backend.geofenceEvents=e.events;}
function operationalGeofencesPage(){
 const intro=head('Geocercas operacionais','Eventos calculados a partir das posições recebidas pela integração. As telas demonstrativas de geocercas e alertas permanecem separadas.');
 if(!backend.user)return intro+'<p>Entre em Conta e cadastros.</p>'+linkBtn('Entrar','account');
 const admin=backend.user.role==='admin',disabled=backend.busy?'disabled':'';
 const number=(label,name,min,max)=>`<label>${label}<input name="${name}" type="number" step="any" min="${min}" max="${max}" required></label>`;
 return intro+`<p class="hint" role="status">${esc(backend.error)}</p><button class="btn" data-geofences-refresh ${disabled}>Atualizar geocercas e eventos</button><p class="hint">Primeira posição estabelece a referência, sem gerar entrada ou saída. Eventos posteriores registram mudanças de lado entre medições; não comprovam o ponto exato da travessia. Consulta manual.</p>`+(admin?panel('Cadastrar geocerca circular',`<form data-geofence-create><div class="two-grid"><label>Nome<input name="name" maxlength="200" required></label><label>Ativo<select name="asset" required><option value="">Selecione</option>${backend.assets.filter(a=>a.active!==0).map(a=>`<option value="${esc(a.id)}">${esc(a.id+' — '+a.name)}</option>`).join('')}</select></label>${number('Latitude do centro','latitude',-90,90)}${number('Longitude do centro','longitude',-180,180)}${number('Raio em metros','radius',50,100000)}</div><button class="btn primary" ${disabled}>Cadastrar geocerca</button></form><p class="hint">Coordenadas decimais. Para alterar centro, raio ou ativo, inative a cerca anterior e crie outra. Não há desenho no mapa nesta etapa.</p>`):'')+panel('Geocercas cadastradas',backend.geofences.length?tb(['Nome','Ativo','Centro','Raio','Situação','Ações'],backend.geofences.map(g=>row([esc(g.name),esc(g.asset_id),esc(g.latitude+', '+g.longitude),esc(g.radius)+' m',g.active?'Ativa':'Inativa',admin?`<button class="btn mini" data-geofence-status="${esc(g.id)}" data-active="${g.active?0:1}" ${disabled}>${g.active?'Inativar':'Reativar'}</button>`:'Consulta']))):'<p>Nenhuma geocerca operacional cadastrada.</p>')+panel('Eventos — 100 mais recentes',backend.geofenceEvents.length?tb(['Geocerca','Ativo','Rastreador','Evento','Horário GPS','Registrado em','Atendimento'],backend.geofenceEvents.map(e=>row([esc(e.zone_name),esc(e.asset_id),esc(backend.devices.find(d=>d.id===e.device_id)?.fields.name||e.device_id),e.kind==='entry'?'Entrada':'Saída',esc(new Date(e.recorded_at).toLocaleString('pt-BR')),esc(new Date(e.created_at).toLocaleString('pt-BR')),e.ack_at?'Reconhecido em '+esc(new Date(e.ack_at).toLocaleString('pt-BR')):`<button class="btn mini" data-geofence-ack="${esc(e.id)}" ${disabled}>Reconhecer</button>`]))):'<p>Nenhum evento registrado. É necessário receber posições que mudem de dentro para fora ou de fora para dentro de uma cerca ativa.</p>')+'<p class="hint">Não há SMS, e-mail, acionamento de equipe, bloqueio físico ou alerta de perda de sinal nesta etapa. A precisão depende dos dados recebidos; não há margem anti-oscilação na borda.</p>';
}
groups[3][1].unshift(['operational-geofences','Geocercas operacionais','location']);menuIndex['operational-geofences']={title:'Geocercas operacionais',icon:'location'};pages['operational-geofences']=operationalGeofencesPage;
document.addEventListener('submit',e=>{const form=e.target.closest('[data-geofence-create]');if(!form)return;e.preventDefault();backendPerform(async()=>{const data=Object.fromEntries(new FormData(form));for(const k of ['latitude','longitude','radius'])data[k]=Number(data[k]);await backendRequest('geofences',data);await refreshGeofences();toast('Geocerca cadastrada. A próxima posição válida estabelecerá a referência.');});});
document.addEventListener('click',e=>{
 if(e.target.closest('[data-geofences-refresh]'))backendPerform(refreshGeofences);
 const status=e.target.closest('[data-geofence-status]');if(status)backendPerform(async()=>{await backendRequest('geofences/status',{id:status.dataset.geofenceStatus,active:Number(status.dataset.active)});await refreshGeofences();toast('Situação da geocerca atualizada. A próxima posição estabelecerá nova referência.');});
 const ack=e.target.closest('[data-geofence-ack]');if(ack)backendPerform(async()=>{await backendRequest('geofence-events/ack',{id:ack.dataset.geofenceAck});await refreshGeofences();toast('Evento reconhecido.');});
});
if(location.protocol!=='file:')backendRequest('me').then(async b=>{backend.user=b.user;backend.csrf=b.csrf;ins.fields.customer=b.user.company;ins.fields.asset='';await backendRefresh();renderPage();}).catch(()=>{});
parseHash();render();
</script></body></html>
