// AMBRAXIS / ANTI-FURTO — protótipo local, sem comandos de hardware e sem rede.
const antiStamp=()=>new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Manaus',hour:'2-digit',minute:'2-digit'}).format(new Date());
const antiAsset=()=>assets.find(a=>a.id===st.antiAsset)||assets[0];
const antiOnline=a=>a.status!=='Sem sinal';
const antiOpenFor=id=>st.antiIncidents.filter(e=>e.asset===id&&e.state!=='Encerrado');
const antiMode=a=>!antiOnline(a)?'Sem comunicação':antiOpenFor(a.id).length?'Em alarme':st.antiArmed[a.id]?'Protegido':'Desarmado';
function antiRecord(title,asset,text='',level='normal'){
 st.antiHistory.unshift({when:antiStamp(),title,asset,text,level});
 if(st.antiHistory.length>60)st.antiHistory.length=60;
 audit.unshift([antiStamp()+':00','Admin Demo',title,asset,level==='critical'?'Crítico':'Demonstração']);
}
function antiRaise(kind,id){
 let a=assets.find(x=>x.id===id);
 if(!a)return;
 let incident={id:'AF-'+String(st.antiSeq++).padStart(3,'0'),asset:id,assetName:a.name,kind,when:antiStamp(),state:'Novo',note:'',severity:'Crítico'};
 st.antiIncidents.unshift(incident);
 alertItems.unshift({id:'ALT-'+incident.id,name:kind==='SOS/Pânico'?'SOS / Pânico — acionamento manual (simulação)':'Possível violação antifurto (simulação)',source:a.name,severity:'Crítico',at:incident.when,state:'Novo',type:'Antifurto'});
 antiRecord(kind,id,'Ocorrência fictícia '+incident.id+' · Sem notificações externas', 'critical');
}
const antiControl=(label,description,action,ic,extra='',disabled=false)=>`<button type="button" class="anti-action ${extra}" data-action="${action}" data-id="${esc(st.antiAsset)}" ${disabled?'disabled':''}>${icon(ic)}<strong>${esc(label)}</strong><small>${esc(description)}</small></button>`;
function antitheftPage(){
 const a=antiAsset(), online=antiOnline(a),armed=!!st.antiArmed[a.id],mode=antiMode(a),open=antiOpenFor(a.id);
 const history=st.antiHistory.filter(e=>e.asset===a.id).slice(0,10);
 const nProtected=assets.filter(x=>antiOnline(x)&&st.antiArmed[x.id]).length;
 const nOpen=st.antiIncidents.filter(x=>x.state!=='Encerrado').length;
 let ids=assets.map(x=>`<option value="${esc(x.id)}" ${x.id===a.id?'selected':''}>${esc(x.name)} · ${esc(x.plate)}</option>`).join('');
 return head('Antifurto e SOS','Proteção de veículos, botão de emergência, prevenção de violação e protocolo de atendimento — tudo simulado, sem conexão real.',`${linkBtn('Central de alertas','alerts')} ${linkBtn('Ver veículo','fleet',a.id)} `,'AMBRAXIS / SEGURANÇA ATIVA')+
 `<div class="anti-warning">${icon('warn','sm')} <strong>AMBIENTE DEMONSTRATIVO:</strong> nenhum botão chama polícia, envia notificações, aciona sirenes, bloqueia ignição ou altera veículos. Os eventos desaparecem ao recarregar o arquivo.</div>`+
 `<div class="metric-grid">${stat('PROTEÇÃO ARMADA',String(nProtected).padStart(2,'0'),'Estados fictícios','shield','green')}${stat('EM ALERTA',String(nOpen).padStart(2,'0'),'Ocorrências na aba','warn',nOpen?'red':'')}${stat('SEM SINAL',String(assets.filter(x=>!antiOnline(x)).length).padStart(2,'0'),'Não presume veículo seguro','wifi','amber')}${stat('DISPOSITIVOS','09','Ativos de demonstração','truck')}</div>`+
 `<div class="card padded mb16"><div class="toolbar" style="margin-bottom:14px"><div class="field" style="flex:1;min-width:220px;max-width:510px"><label for="anti-select">Selecione o veículo monitorado</label><select id="anti-select" data-anti-asset>${ids}</select></div><div style="align-self:end;display:flex;gap:8px;flex-wrap:wrap">${linkBtn('Localização','live')} ${linkBtn('Câmeras','video')} ${linkBtn('Histórico de alertas','alerts')}</div></div><div class="anti-hero"><div><div class="overline">${esc(a.id)} · ${esc(a.plate)}</div><h2>${esc(a.name)}</h2><p>${esc(a.loc)} · ${esc(a.tenant)}<br>Estado de comunicação: ${esc(a.status)} (fictício)</p></div><div class="anti-status ${mode==='Protegido'?'':mode==='Em alarme'?'alarm':'off'}"><span class="light"></span><span>${esc(mode.toUpperCase())}</span></div></div><div class="anti-actions">${antiControl('Armar proteção','Ativa o estado protegido na demonstração','anti-arm','shield','',armed||!online)}${antiControl('Desarmar proteção','Solicita confirmação e justificativa','anti-disarm','unlock','',!armed)}${antiControl('Simular violação','Movimento/ignição não autorizados','anti-violation','warn','',!armed||!online)}${antiControl('BOTÃO SOS / PÂNICO','Simular alerta crítico manual','anti-sos','bell','emergency')}</div><div class="hint">Proteção armada não equivale à confirmação de funcionamento de um rastreador real. Equipamentos sem sinal não podem garantir alerta em tempo real.</div></div>`+
 `<div class="section-grid">${panel('Localização e correlação',mapWidget({selected:a.id,compact:true})+`<p class="hint mt12">Mapa esquemático e última posição fictícia; não representa monitoramento GPS em tempo real.</p>`,linkBtn('Abrir mapa','live'))}${panel('Situação de proteção',`<div class="subtle-list">${val('Modo',mode)}${val('Veículo',a.name)}${val('Comunicação',a.status)}${val('Ignição (exemplo)',a.speed>0?'Ligada':'Desligada')}${val('Eventos em atendimento',String(open.length))}${val('Comandos físicos','Desativados')}</div><div class="separator"></div><p class="hint">O mecanismo real exigirá autenticação forte, sensores homologados, geocercas, dupla validação para comandos sensíveis e políticas de escalonamento.</p>`)}</div>`+
 `<div class="two-grid mt16">${panel('Ocorrências do antifurto',st.antiIncidents.filter(x=>x.asset===a.id).slice(0,10).map(e=>`<div class="anti-incident"><div style="flex:1;min-width:0"><strong>${esc(e.kind)} · ${esc(e.id)}</strong><small>${esc(e.when)} · ${esc(e.assetName)} · ${esc(e.state)}${e.note?' · '+esc(e.note):''}</small></div><div class="btn-row">${badge(e.state)}${e.state==='Novo'?`<button class="btn mini" data-action="anti-ack" data-id="${esc(e.id)}">Reconhecer</button>`:''}${e.state!=='Encerrado'?`<button class="btn mini" data-action="anti-resolve" data-id="${esc(e.id)}">Encerrar</button>`:''}</div></div>`).join('')||`<div class="empty">Nenhuma ocorrência deste veículo nesta sessão. Experimente o botão SOS ou simule uma violação.</div>`,linkBtn('Central de alertas','alerts'))}${panel('Linha do tempo',`<div>${history.map(h=>`<div class="anti-log ${h.level==='critical'?'critical':''}"><strong>${esc(h.title)}</strong><small>${esc(h.when)} · ${esc(h.text)}</small></div>`).join('')||`<div class="empty">Ainda não há eventos para este veículo. Ative o modo antifurto para testar.</div>`}</div>`)}</div>`+
 `<div class="mt16">${panel('Políticas simuladas de detecção',`<div class="anti-tool-grid">${[['movement','Movimento não autorizado','Deslocamento fora da janela de uso'],['ignition','Ignição inesperada','Partida quando o veículo estiver protegido'],['geofence','Saída de geocerca','Rompimento de perímetro permitido'],['power','Corte de alimentação','Falha ou tentativa de desligamento do dispositivo']].map(([id,name,desc])=>`<div class="anti-rule"><div><strong>${esc(name)}</strong><small>${esc(desc)}</small></div><button class="switch ${st.antiRules[id]?'on':''}" aria-label="Alternar regra ${esc(name)}" aria-pressed="${st.antiRules[id]?'true':'false'}" data-anti-rule="${id}"></button></div>`).join('')}</div><p class="hint mt16">As chaves alteram apenas a aparência e o estado em memória; nenhuma regra operacional está conectada. No sistema real os dispositivos devem ser homologados para cada evento.</p>`,btn('Fluxo de atendimento','anti-protocol','','file'))}</div>`;
}

}else if(action==='api-docs'){title='API AMBRAXIS — Especificação conceitual';desc='Exemplos não funcionais de rotas planejadas';body=`<div class="stack"><div class="catalog-card"><span class="chip info">GET</span><div><strong class="mono">/v1/assets</strong><small>Listar ativos autorizados da organização</small></div></div><div class="catalog-card"><span class="chip info">GET</span><div><strong class="mono">/v1/telemetry/{assetId}</strong><small>Consultar histórico de telemetria</small></div></div><div class="catalog-card"><span class="chip info">GET</span><div><strong class="mono">/v1/cargo/{containerId}/events</strong><small>Eventos e abertura de carga</small></div></div><div class="catalog-card"><span class="chip info">POST</span><div><strong class="mono">/v1/alerts/acknowledgements</strong><small>Registrar reconhecimento autorizado</small></div></div><p class="hint">Rotas apenas documentais. Não há servidor nem API acessível.</p></div>`;
}else if(action==='site-map'){title='Mapa funcional';desc='26 telas navegáveis e subpáginas de detalhes';body=groups.map(g=>`<h3 class="overline mt16">${g[0]}</h3><div class="btn-row mt12">${g[1].map(([id,label])=>`<button class="btn mini" data-nav="${id}">${label}</button>`).join('')}</div>`).join('');wide=true;
}else if(action==='architecture'){title='Arquitetura planejada';desc='Componentes lógicos — não implementados';body=`<div class="stack">${[['1. Dispositivos','GPS 4G, sensores, MDVR e câmeras IP'],['2. Gateway','Traccar e adaptadores de protocolos'],['3. Serviços centrais','Node.js, filas de mensagens, PostgreSQL/PostGIS'],['4. Vídeo','Gateway ONVIF/RTSP, MediaMTX, armazenamento privado'],['5. Inteligência','Open MCT, H3, OR-Tools, IA sob permissão'],['6. Interface','React, MapLibre, portal e aplicativos móveis']].map(([a,b])=>`<div class="catalog-card"><span class="catalog-icon">${icon('layers')}</span><div><strong>${a}</strong><small>${b}</small></div></div>`).join('')}</div>`;
}else if(action==='authorization-approve'){title='Simular aprovação de abertura';desc='Contêiner: nenhum dispositivo conectado';body=`<div class="notice-banner">${icon('warn','sm')} Esta aprovação não tem efeito sobre cadeados ou lacres físicos. Não confirma autorização real.</div><div class="subtle-list">${val('Solicitação',attrsId)}${val('Vínculo com geocerca','Não verificado')}${val('Identidade do aprovador','Demo')}${val('Comando ao lacre','Proibido')}</div>`;actions=`<button class="btn primary" data-action="confirm-approve" data-id="${esc(attrsId)}">Somente simular estado</button>`;
}else if(action==='ack-alert'){title='Simular reconhecimento';desc='Nenhum registro será enviado ao servidor';body=`<p class="hint">A ocorrência <strong>${esc(st.detail)}</strong> poderá aparecer como reconhecida durante esta sessão do navegador. Não representa atendimento real.</p>`;actions=`<button class="btn primary" data-action="confirm-ack">Reconhecer apenas na tela</button>`;
}else if(action==='details-device'||action==='seal-detail'||action==='user-detail'||action==='dispatch-detail'||action==='route-details'||action==='geofence-details'){let [t,d]=actionModalTitles[action];title=t;desc=d;body=`<div class="subtle-list">${val('Identificador',attrsId||'Exemplo')}${val('Ambiente','Demonstração')}${val('Integração','Inativa')}${val('Persistência','Não implementada')}</div><div class="btn-row mt22">${btn('Simular edição','edit-generic','','settings')}${btn('Ver histórico','history-generic','','history')}</div>`;
}else if(action==='integration-detail'){title=(attrsName||'Conector')+' — Integração';desc='A arquitetura prevê um adaptador independente para este serviço.';body=`<div class="subtle-list">${val('Serviço',attrsName||'Indefinido')}${val('Estado','Não conectado')}${val('Credenciais','Nenhuma')}${val('Requisições de rede','Desativadas')}${val('Plano','Homologar antes do uso')}</div><div class="notice-banner mt16" style="margin-bottom:0">${icon('shield','sm')} Não informe chaves ou tokens reais neste protótipo.</div>`;
}else {let [t,d]=actionModalTitles[action]||['Função demonstrativa','Esta funcionalidade está planejada e não possui execução real.'];title=t;desc=d;body=`<p class="hint">A interface deste recurso está representada para validar navegação, fluxo de usuário e experiência visual.</p><div class="separator"></div><div class="subtle-list">${val('Ambiente','Protótipo offline')}${val('Serviço externo','Não conectado')}${val('Alteração real','Nenhuma')}${val('Referência',attrsName||attrsId||'AMBRAXIS')}</div>`;}
$('#modal-root').innerHTML=modalMarkup(title,desc,body,actions,wide);if(action==='search-global')setTimeout(()=>$('#global-search-input')?.focus(),10);

function closeModal(){const root=$('#modal-root');if(root)root.innerHTML='';st.modalKind='';}
function doAction(action,el){let id=el.dataset.id||'',name=el.dataset.name||'';switch(action){
case 'anti-confirm':{
 const mode=el.dataset.mode,targetId=mode==='anti-sos'?($('#anti-sos-asset')?.value||id):id,a=assets.find(x=>x.id===targetId)||antiAsset();
 if(mode==='anti-arm'){
  if(!antiOnline(a)){toast('Sem comunicação: não é possível confirmar proteção do dispositivo.');closeModal();break;}
  st.antiArmed[a.id]=true;antiRecord('Proteção armada (demo)',a.id,'Comando apenas visual; nenhuma configuração foi enviada');
 }else if(mode==='anti-disarm'){
  const reason=$('#anti-reason')?.value.trim();if(!reason){toast('Informe um motivo para o desarme.');$('#anti-reason')?.focus();break;}
  st.antiArmed[a.id]=false;antiRecord('Proteção desarmada (demo)',a.id,reason);
 }else if(mode==='anti-violation'){
  if(!st.antiArmed[a.id]||!antiOnline(a)){closeModal();toast('A simulação de violação requer veículo fictício protegido e comunicado.');break;}
  antiRaise('Possível movimentação não autorizada',a.id);
 }else if(mode==='anti-sos')antiRaise('SOS/Pânico',a.id);
 closeModal();render();toast('Operação demonstrativa concluída. Nenhum alerta externo ou comando físico.');break;
}
case 'anti-confirm-ack':{
 const entry=st.antiIncidents.find(x=>x.id===id);if(entry&&entry.state==='Novo'){entry.state='Em atendimento';const alt=alertItems.find(x=>x.id==='ALT-'+id);if(alt)alt.state='Em análise';antiRecord('Ocorrência reconhecida (demo)',entry.asset,entry.id+' · Acompanhamento visual');}
 closeModal();render();toast('Ocorrência fictícia reconhecida.');break;
}
case 'anti-confirm-resolve':{
 const reason=$('#anti-reason')?.value.trim();if(!reason){toast('Informe a justificativa do encerramento.');$('#anti-reason')?.focus();break;}
 const entry=st.antiIncidents.find(x=>x.id===id);if(entry){entry.state='Encerrado';entry.note=reason;const alt=alertItems.find(x=>x.id==='ALT-'+id);if(alt)alt.state='Reconhecido';antiRecord('Ocorrência encerrada (demo)',entry.asset,entry.id+' · '+reason);}
 closeModal();render();toast('Encerramento simulado; nada foi enviado.');break;
}
case 'toggle-sidebar':st.sidebarOpen=!st.sidebarOpen;render();break;
case 'close-sidebar':st.sidebarOpen=false;render();break;
case 'theme':st.theme=st.theme==='dark'?'light':'dark';render();toast('Aparência alterada apenas neste navegador.');break;
case 'close-toast':$('#toast-root').innerHTML='';break;
case 'close-modal':closeModal();break;
case 'modal-backdrop':if(el.classList.contains('modal-backdrop'))closeModal();break;
case 'mock-submit':{let form=$('#mock-form');if(form&&!form.reportValidity())return;closeModal();toast('Cadastro simulado. Nenhum dado foi armazenado.');break;}
case 'confirm-approve':st.simApprovals.add(id);closeModal();renderPage();toast('Aprovação visual simulada. Nenhum lacre foi acionado.');break;
case 'confirm-ack':if(st.detail)st.simAcknowledged.add(decodeURIComponent(st.detail));closeModal();renderPage();toast('Reconhecimento visual simulado. Sem registro externo.');break;
case 'export-demo':{const rows=[['ID','Tipo','Nome','Estado','OBS'],...assets.map(a=>[a.id,a.type,a.name,a.status,'DADO FICTÍCIO'])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const dl=document.createElement('a');dl.href=url;dl.download='VF_TRACK_AMOSTRA_FICTICIA.csv';document.body.appendChild(dl);dl.click();dl.remove();setTimeout(()=>URL.revokeObjectURL(url),500);closeModal();toast('Arquivo CSV fictício exportado.');break;}
case 'map-plus':case 'map-minus':case 'map-center':toast('Controle de mapa ilustrativo. Mapa real será integrado na próxima etapa.');break;
case 'replay-toggle':st.playing=!st.playing;renderPage();toast(st.playing?'Reprodução ilustrativa iniciada.':'Reprodução ilustrativa pausada.');break;
case 'replay-reset':st.playPercent=0;st.playing=false;renderPage();break;
case 'go-telemetry':navigate('telemetry');break;
case 'reset-chat':st.chat=[{who:'bot',msg:'Nova conversa demonstrativa. Nenhuma IA foi conectada.'}];renderPage();break;
case 'save-settings':toast('Preferências apenas simuladas; não houve gravação em banco.');break;
case 'reset-settings':st.setting={'Notificações no navegador':true,'Alertas sonoros':false,'Modo de economia de dados':true,'Acesso com MFA obrigatório':true,'Exigir autorização dupla':true,'Exibir coordenadas completas':false};renderPage();toast('Preferências visuais restauradas.');break;
default:showModal(action,{id,name});}
}
function chatReply(question){let q=question.toLowerCase();if(/sem sinal|offline|comunica/.test(q))return 'Consulta demonstrativa: Moto Entrega 04 aparece como SEM SINAL, com última posição fictícia em Cidade Nova. Recomenda-se validar o equipamento antes de tomar decisões.';if(/antifurto|pânico|panico|sos|furto/.test(q))return 'O AMBRAXIS possui agora um módulo Antifurto e SOS com proteção, simulação de violação e central de atendimento. Nenhuma ação é real; abra Antifurto e SOS no menu de Segurança.';if(/contêiner|conteiner|lacre|viola/.test(q))return 'Consulta demonstrativa: o contêiner TGHU-887120-2 possui um evento fictício de abertura não autorizada. Consulte Cargo Guard e a Central de Alertas para ver o exemplo.';if(/crític|critic|alerta/.test(q))return 'Resumo demonstrativo: dois registros críticos de segurança de carga e um aviso de baixa tensão aparecem no conjunto sintético de dados. Nenhuma notificação real foi emitida.';if(/cftv|câmera|camera|vídeo|video/.test(q))return 'No projeto real, câmeras ONVIF/RTSP e MDVRs serão vinculados a ativos e contêineres. O videowall atual contém somente ilustrações, sem transmissão.';if(/rota|trajeto|parad/.test(q))return 'As rotas e os trajetos disponíveis são ilustrações. Na futura versão de produção, o sistema combinará histórico GPS, geocercas e otimização.';return 'Resposta demonstrativa: explore os módulos Mapa ao vivo, Central de alertas, Videowall e Cargo Guard. Para responder usando dados reais, o AMBRAXIS Intelligence exigirá backend, políticas de autorização e integração com um modelo de IA.';}
function processChat(q){if(!q.trim())return;st.chat.push({who:'user',msg:q.trim()});st.chat.push({who:'bot',msg:chatReply(q)});renderPage();const msgs=$('#chat-messages');if(msgs)msgs.lastElementChild?.scrollIntoView({block:'nearest'});}
document.addEventListener('click',event=>{const nav=event.target.closest('[data-nav]');if(nav){st.sidebarOpen=false;closeModal();navigate(nav.dataset.nav,nav.dataset.detail||'');return;}const as=event.target.closest('[data-select-asset]');if(as){st.selectedAsset=as.dataset.selectAsset;renderPage();return;}const faq=event.target.closest('[data-faq]');if(faq){st.faqOpen=st.faqOpen===Number(faq.dataset.faq)?-1:Number(faq.dataset.faq);renderPage();return;}const prompt=event.target.closest('[data-chat-prompt]');if(prompt){processChat(prompt.dataset.chatPrompt);return;}const ar=event.target.closest('[data-anti-rule]');if(ar){let k=ar.dataset.antiRule;st.antiRules[k]=!st.antiRules[k];renderPage();toast('Regra alterada somente na demonstração.');return;}const sw=event.target.closest('[data-toggle-setting]');if(sw){let k=sw.dataset.toggleSetting;st.setting[k]=!st.setting[k];sw.classList.toggle('on',!!st.setting[k]);toast('Preferência alterada somente na tela.');return;}const tabs=['alert-filter','cargo-filter','telemetry-mode','video-layout-tab'];for(let tag of tabs){let el=event.target.closest(`[data-${tag}]`);if(el){let v=el.dataset[tag.replace(/-([a-z])/g,(_,c)=>c.toUpperCase())];if(tag==='alert-filter')st.alertFilter=v;if(tag==='cargo-filter')st.cargoFilter=v;if(tag==='telemetry-mode')st.telemetry=v;if(tag==='video-layout-tab')st.videoLayout=v;renderPage();return;}}const speed=event.target.closest('[data-speed]');if(speed){$('[data-speed]').forEach(x=>x.classList.remove('active'));speed.classList.add('active');toast('Velocidade de reprodução ilustrativa: '+speed.dataset.speed);return;}const ac=event.target.closest('[data-action]');if(ac){if(ac.dataset.action==='modal-backdrop'&&event.target!==ac)return;doAction(ac.dataset.action,ac);}});
document.addEventListener('input',event=>{let el=event.target;if(el.matches('[data-search]')){const v=el.value.toLocaleLowerCase('pt-BR');$('.'+el.dataset.search).forEach(row=>{row.style.display=(row.dataset.searchValue||'').toLowerCase().includes(v)?'':'none';});}if(el.matches('[data-replay-range]')){st.playPercent=Number(el.value);const c=$('#replay-clock'),s=$('#replay-speed');if(c)c.textContent=`${String(8+Math.floor(st.playPercent/17)).padStart(2,'0')}:${String(st.playPercent%60).padStart(2,'0')}`;if(s)s.textContent=Math.round(st.playPercent*.75)+' km/h';}});
document.addEventListener('change',event=>{let el=event.target;if(el.matches('[data-filter-rows]')){let type=el.dataset.filterRows,v=el.value,cls=type==='fleet'?'table-row':'device-row';$('.'+cls).forEach(row=>row.style.display=v==='Todos'||row.dataset.filterValue===v?'':'none');}if(el.matches('[data-anti-asset]')){st.antiAsset=el.value;renderPage();}if(el.matches('[data-replay-asset]')){st.replayAsset=el.value;renderPage();}if(el.matches('[data-report-period]')){st.reportPeriod=el.value;toast('Período selecionado apenas para a interface.');}});

  generic:{name:'Outro fabricante / homologação',brand:'A confirmar',power:'Consultar manual',protocol:'Indefinido',port:'A confirmar',manual:'https://www.traccar.org/devices/',pins:[],abilities:['power','ignition','door','sos','analog','cargo','video']}

{key:'power',name:'01 · Alimentação e aterramento',type:'alimentação',explain:'Fonte DC compatível → proteção apropriada no positivo → VCC. Retorno → GND. O dimensionamento da proteção e a escolha do ponto de conexão devem seguir o manual e o projeto elétrico.',right:'Bateria / fonte DC compatível',side:'VCC (+) e GND (−)',note:'Nunca conectar energizado. Confirmar polaridade e tensão com multímetro; não usar conexões em módulos de airbag, ABS ou ECU.'},
{key:'ignition',name:'02 · Leitura de ignição',type:'entrada',explain:'Uma entrada digital configurada recebe o sinal de pós-chave/ignição, conforme polaridade e faixa permitidas pelo fabricante. No FMC130, referência usual DIN1; no FMB920, DIN1 é a única entrada digital.',right:'Sinal de ignição aferido',side:'Entrada DIN configurada',note:'A leitura de ignição deve ser feita em ponto apropriado. Não realizar derivações em rede CAN ou unidades eletrônicas.'},
{key:'door',name:'03 · Sensor de abertura de porta',type:'entrada',explain:'O contato de porta passa por uma interface compatível com a entrada digital do modelo; definir contato normalmente aberto (NA) ou normalmente fechado (NF) e validar a lógica de alarme.',right:'Contato magnético / sensor',side:'DIN configurada para porta',note:'FMC130: DIN2-N pode ser considerada após verificar o modo de entrada. FMB920: não há DIN adicional exclusiva; se DIN1 for usada para ignição, será necessário hardware adicional ou outro modelo.'},
{key:'sos',name:'04 · Botão SOS / pânico',type:'entrada',explain:'Botão momentâneo liga-se a uma entrada digital compatível, respeitando a polaridade e a tensão aceitas pelo circuito de entrada. O evento será configurado e validado separadamente.',right:'Botão momentâneo',side:'DIN disponível e configurada',note:'FMC130: avaliar DIN3 após configurar como digital. FMB920: só há DIN1; ela não pode servir simultaneamente como entradas isoladas para SOS e ignição.'},
{key:'analog',name:'05 · Sensor analógico',type:'entrada',explain:'Sensor com saída analógica em faixa compatível → entrada AIN. É necessário terra de referência adequado, calibração e ajuste do tipo de sinal. Não pressupor sensores resistivos ou de combustível como ligação direta.',right:'Sensor analógico compatível',side:'AIN configurada',note:'FMC130: AIN1 ou AIN2 conforme modo; FMB920: AIN1 0–30 V. Calibração depende do transdutor, não apenas do rastreador.'},
{key:'onewire',name:'06 · Sensor 1-Wire (FMC130)',type:'acessório',explain:'No FMC130, sensor 1-Wire compatível utiliza DATA, alimentação própria 1-Wire do aparelho e retorno GND, conforme especificação do sensor e do fabricante.',right:'Sensor 1-Wire compatível',side:'1-Wire PWR / DATA / GND',note:'Somente FMC130 nesta biblioteca. O FMB920 não oferece essas conexões na pinagem apresentada; não improvise ligações.'},
{key:'output',name:'07 · Saída de sinalização auxiliar',type:'saída',explain:'Saída digital do tipo coletor aberto pode comandar entrada de driver apropriado para sinalizador compatível, com alimentação, proteção e limite de corrente definidos pelo fabricante.',right:'Driver → sinalizador adequado',side:'DOUT configurada',note:'Não ligar carga arbitrária diretamente na DOUT. Nenhuma instrução de corte de motor ou bloqueio de partida é fornecida nesta demonstração.'},
{key:'can',name:'08 · Adaptador veicular CAN autorizado',type:'acessório',explain:'O FMC130 pode comunicar-se com adaptadores compatíveis por interfaces dedicadas TX EXT / RX EXT. A conexão ao veículo depende do manual do adaptador e do fabricante do veículo.',right:'Adaptador CAN homologado',side:'TX EXT / RX EXT (FMC130)',note:'Não conectar as entradas de rastreador diretamente a CAN-H e CAN-L. Exige equipamento e esquema oficial específicos.'},
{key:'cargo',name:'09 · Lacre e sensor de contêiner',type:'integração',explain:'Lacre eletrônico ou sensor de porta transmite evento por tecnologia e gateway compatíveis (entrada digital, BLE, rede celular ou plataforma de fabricante). O AMBRAXIS associa evento ao ativo.',right:'Lacre / gateway homologado',side:'Evento → rastreador / API',note:'Para contêiner independente, avaliar bateria, blindagem metálica, cobertura de rede, GPS e sincronização horária. Não supor abertura remota.'},
{key:'video',name:'10 · CFTV embarcado vinculado ao GPS',type:'integração',explain:'Câmera ou MDVR envia vídeo para um gateway de mídia autorizado; o rastreador envia telemetria separadamente. A plataforma associa ambos por identificador do ativo e timestamp.',right:'MDVR / câmera IP',side:'VMS / AMBRAXIS VIDEO + GPS',note:'RTSP/ONVIF não são portas elétricas do rastreador. O vídeo exige rede, gravação e permissões próprias.'}
];
const INSTALL_STEPS=['Modelo','Cliente & identificação','Pré-instalação','Ligações & esquemas','SIM & APN','Servidor & comandos','Diagnóstico','Conclusão'];
const ins={model:'fmc130',step:0,scheme:'power',diagramTab:'visuais',fields:{customer:'Logística Norte',asset:'VFT-001',name:'Rastreador de demonstração',imei:'',iccid:'',serial:'',chip:'',apn:'',apnUser:'',apnPass:'',server:'gps.seudominio.com',port:'5027',transport:'TCP',firmware:'',installer:'',notes:''},checks:{},diag:{chip:'Pendente',power:'Pendente',tcp:'Pendente',id:'Pendente',gnss:'Pendente',sensors:'Pendente'},reported:false};
const iModel=()=>INSTALL_MODELS[ins.model];
const iTick=(label,id)=>`<label class="ins-check"><input type="checkbox" data-ins-check="${id}" ${ins.checks[id]?'checked':''}><span>${label}</span></label>`;

function iWires(key){
const f=ins.model==='fmc130',b=ins.model==='fmb920';
const inIgn=f?'P5 DIN1':b?'P3 DIN1':'Entrada digital a homologar';
const inDoor=f?'P4 DIN2-N (modo digital)':b?'P3 DIN1 — SOMENTE se não utilizado para ignição':'Entrada digital a homologar';

const inAnal=f?'P3 DIN3/AIN2 ou P4 DIN2/AIN1 (modo AIN)':b?'P4 AIN1':'AIN homologada';

const power=f?'P1 VCC':b?'P1 VCC':'VCC — confirmar pino';const gnd=f?'P7 GND':b?'P2 GND':'GND — confirmar pino';

 power:[['+ DC da fonte dentro da faixa do modelo','Proteção elétrica conforme projeto',power],['− DC da fonte / retorno apropriado','Condutor de retorno',gnd]],
 ignition:[['Pós-chave avaliado por técnico','Conformidade da faixa e polaridade',inIgn],['Referência elétrica, se exigida','Aterramento conforme manual',gnd]],
 door:[['Contato de porta NA/NF homologado','Adequação elétrica e lógica do sensor',inDoor],['Retorno/referência do circuito','Conforme o projeto e manual',gnd]],
 sos:[['Botão momentâneo com circuito adequado','Interface de entrada compatível',inSos],['Retorno/referência do circuito','Conforme o projeto e manual',gnd]],
 analog:[['Saída de transdutor em faixa permitida','Condicionamento e calibração',inAnal],['Referência do transdutor','Retorno compatível',gnd]],
 onewire:[['Alimentação 1-Wire do FMC130','Cabo do acessório homologado','P10 1WIRE POWER'],['Linha de dados 1-Wire','Cabo do sensor','P11 1WIRE DATA'],['Retorno do sensor','GND recomendado no esquema do acessório','P7 GND']],
 output:[[inOut,'Circuito driver/isolação homologado','Sinalizador de baixa potência'],['Fonte e proteção do sinalizador','Ligação do driver conforme fabricante','Sinalizador / buzzer']],
 can:[['P6 INPUT6 / TX EXT','Interface dedicada do adaptador','Adaptador CAN compatível'],['P12 INPUT5 / RX EXT','Interface dedicada do adaptador','Adaptador CAN compatível'],['Adaptador autorizado','Conexão de veículo apenas por esquema oficial','Rede veicular — não ligar diretamente']],
 cargo:[['Lacre / sensor de abertura','Comunicação via gateway homologado','Evento assinado ou autenticado'],['GPS do ativo','Telemetria por protocolo homologado','AMBRAXIS — correlação temporal']],
 video:[['Câmera IP / MDVR','Rede autorizada / gateway de mídia','AMBRAXIS VIDEO — gravações'],['GPS / rastreador','Protocolo de telemetria','AMBRAXIS — correlação temporal']]
})[key]||[];
}
function iWireTable(key){if((key==='onewire'||key==='can')&&ins.model!=='fmc130')return '<div class="ins-alert"><strong>Não compatível ou não homologado:</strong> não conectar estes acessórios ao modelo escolhido sem uma interface e manual específico.</div>';return `<div class="table-wrap ins-wire-table"><table class="data-table"><thead><tr><th>Origem</th><th>Interface / proteção</th><th>Destino</th></tr></thead><tbody>${iWires(key).map(([a,b,c])=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td><td>${esc(c)}</td></tr>`).join('')}</tbody></table></div>`}
function iDiagram(key=ins.scheme){const sch=INSTALL_SCHEMES.find(x=>x.key===key)||INSTALL_SCHEMES[0],m=iModel(),isUnsupported=(key==='onewire'||key==='can')&&ins.model!=='fmc130';const pin=({power:ins.model==='fmc130'?'P1 VCC · P7 GND':ins.model==='fmb920'?'P1 VCC · P2 GND':'Conferir no manual',ignition:ins.model==='fmc130'?'P5 DIN1':ins.model==='fmb920'?'P3 DIN1':'Verificar entrada digital',door:ins.model==='fmc130'?'P4 DIN2-N':'Entrada disponível?',sos:ins.model==='fmc130'?'P3 DIN3 (modo DIN)':'Entrada disponível?',analog:ins.model==='fmc130'?'P3 / P4 (modo AIN)':'P4 AIN1',onewire:'P10 + P11 + P7',output:ins.model==='fmc130'?'P8 DOUT1':'P5 DOUT1',can:'P6 TX EXT + P12 RX EXT',cargo:'Interface conforme lacre',video:'Sem fio direto ao GPS'})[key]||'Consultar fabricante';
return `<div class="ins-scheme-card"><div class="ins-scheme-head"><h3>${esc(sch.name)}</h3><span class="chip ${isUnsupported?'bad':'info'}">${isUnsupported?'Não suportado neste modelo':'Diagrama funcional'}</span></div><svg class="ins-svg" viewBox="0 0 730 237" role="img" aria-label="Diagrama funcional de ${esc(sch.name)}"><defs><linearGradient id="ingrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173a50"/><stop offset="1" stop-color="#0a2834"/></linearGradient></defs><rect x="8" y="17" width="220" height="164" rx="15" fill="url(#ingrad)" stroke="#39758a" stroke-width="2"/><rect x="500" y="17" width="220" height="164" rx="15" fill="url(#ingrad)" stroke="#39758a" stroke-width="2"/><text x="118" y="61" fill="#78e4dd" font-size="17" font-weight="700" text-anchor="middle">${esc(sch.right.length>22?sch.right.slice(0,22)+'…':sch.right)}</text><text x="610" y="61" fill="#78e4dd" font-size="16" font-weight="700" text-anchor="middle">${esc(m.name)}</text><text x="610" y="104" fill="#e3f5f6" font-size="14" text-anchor="middle">${esc(isUnsupported?'Não disponível neste modelo':pin)}</text><path d="M228 75 H495" stroke="${key==='power'?'#ffb54d':'#53d7bb'}" stroke-width="5" stroke-linecap="round"/><path d="M482 66 L495 75 482 84" fill="none" stroke="#53d7bb" stroke-width="5" stroke-linejoin="round"/><rect x="330" y="54" width="70" height="40" rx="8" fill="#1a455b" stroke="#5d93a9"/><text x="365" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${key==='power'?'FUSÍVEL':key==='output'?'DRIVER':'SINAL'}</text>${key==='power'?`<path d="M495 139 H228" stroke="#79aabf" stroke-width="4" stroke-dasharray="8 5"/><text x="365" y="130" text-anchor="middle" fill="#bed1e1" font-size="12">Retorno GND</text>`:''}<text x="365" y="208" text-anchor="middle" fill="#a4bed0" font-size="12">Esquema de interligação funcional • sem orientação de corte de chicote</text></svg><p>${esc(sch.explain)}</p>${iWireTable(key)}<div class="ins-safety">${icon('warn','sm')} ${esc(sch.note)}</div></div>`;}
function iPins(){const m=iModel();if(!m.pins.length)return `<div class="ins-alert">A pinagem deste modelo não foi homologada. Cadastre o manual oficial e a revisão do chicote antes de realizar qualquer instalação.</div>`;
return `<div class="ins-pin-layout"><div><div class="ins-pin-head">Conector documentado — ${esc(m.name)}</div><div class="ins-pin-chip">${m.pins.map(p=>`<div><b>${p[0]}</b><strong>${esc(p[1])}</strong><small>${esc(p[2])}</small></div>`).join('')}</div></div><div><div class="ins-pin-head">Tabela de pinagem oficial</div><div class="table-wrap"><table class="data-table"><thead><tr><th>Pino</th><th>Sinal</th><th>Função</th></tr></thead><tbody>${m.pins.map(p=>`<tr><td><b>${p[0]}</b></td><td>${esc(p[1])}</td><td>${esc(p[2])}</td></tr>`).join('')}</tbody></table></div></div></div><p class="hint mt12">Números e nomes foram transcritos da documentação oficial; o desenho acima é uma lista funcional, NÃO uma vista da face física do conector. Confira a orientação dos pinos no diagrama original antes de ligar os fios.</p><div class="btn-row mt12"><a class="btn" target="_blank" rel="noopener noreferrer" href="${esc(m.manual)}">${icon('external','sm')} Ver manual do fabricante</a><a class="btn" target="_blank" rel="noopener noreferrer" href="https://www.traccar.org/devices/">${icon('external','sm')} Ver protocolo no Traccar</a></div>`;}
function iReview(){return `<div class="ins-review"><div class="ins-stat"><strong>Modelo</strong>${esc(iModel().name)}</div><div class="ins-stat"><strong>Empresa / ativo</strong>${esc(ins.fields.customer||'Não informado')} / ${esc(ins.fields.asset||'Não informado')}</div><div class="ins-stat"><strong>Identificador</strong>${esc(ins.fields.imei||'Não informado')}</div><div class="ins-stat"><strong>Rede</strong>APN: ${esc(ins.fields.apn||'Não definida')}</div><div class="ins-stat"><strong>Servidor</strong>${esc(ins.fields.server||'Não definido')}:${esc(ins.fields.port||'—')} • ${esc(ins.fields.transport)}</div><div class="ins-stat"><strong>Pronto para operação real?</strong><span class="chip warn">Não — simulação</span></div></div>`;}
function iSMS(){if(ins.model==='generic')return 'Modelo sem comando homologado. Consulte o manual específico.';let f=ins.fields;return '  setparam 2001:'+(f.apn||'[APN]')+';2002:'+(f.apnUser||'')+';2003:'+(f.apnPass||'')+';2004:'+(f.server||'[DOMINIO]')+';2005:'+(f.port||'5027')+';2006:'+(f.transport==='UDP'?'1':'0');}
function iStepContent(){const m=iModel();switch(ins.step){
case 0:return `<h2>Escolha a marca e o modelo</h2><p class="hint mb16">Somente os dois modelos Teltonika abaixo têm pinagem conferida em documentação oficial. Outros aparelhos entram no fluxo sem esquema presumido.</p><div class="ins-model-grid">${Object.entries(INSTALL_MODELS).map(([id,v])=>`<button class="ins-model ${ins.model===id?'selected':''}" data-install-model="${id}">${icon(id==='generic'?'help':'cpu')}<strong>${v.name}</strong><small>${v.brand} · ${v.power}</small><span class="chip ${id==='generic'?'warn':'good'}">${id==='generic'?'Pendente de homologação':'Manual verificado'}</span></button>`).join('')}</div>${panel('Identificação técnica',`<div class="subtle-list">${val('Modelo',m.name)}${val('Alimentação',m.power)}${val('Protocolo',m.protocol)}${val('Porta Traccar padrão',m.port)}</div><div class="mt16"><a class="btn mini" target="_blank" rel="noopener noreferrer" href="${m.manual}">Manual oficial ${icon('external','sm')}</a></div>`)}`;
case 1:return `<h2>Empresa, ativo e identificador do aparelho</h2><p class="hint mb16">Na versão real, o identificador (uniqueId) será checado contra duplicidades antes da ativação.</p><div class="form-grid">${iField('Cliente / empresa','customer','Ex.: Transporte Norte','required')}${iField('ID do veículo ou ativo','asset','Ex.: VFT-001','required')}${iField('Nome do dispositivo','name','Rastreador principal')}${iField('IMEI / uniqueId','imei','Normalmente 15 dígitos',`inputmode="numeric" maxlength="24"`)}${iField('Número de série','serial','Conforme etiqueta')}${iField('ICCID do chip','iccid','Conforme operadora')}${iField('Telefone do chip (opcional)','chip','Número do chip')}${iField('Responsável pela instalação','installer','Nome do técnico')}</div><div class="ins-alert">Nunca publique IMEI, ICCID ou credenciais reais em capturas de tela ou solicitações de suporte abertas.</div>`;
case 2:return `<h2>Checklist de preparação</h2><p class="hint mb16">Confirme os itens antes de iniciar a montagem no veículo ou bancada.</p><div class="ins-check-grid">${iTick('Manual e revisão de chicote confirmados','manual')}${iTick('Tensão de alimentação medida','voltage')}${iTick('Veículo em condição segura e energia isolada','off')}${iTick('Chip compatível, ativo e com dados','sim')}${iTick('SIM inserido com rastreador desligado','simoff')}${iTick('Pinagem, polaridade e proteção revisadas','polarity')}${iTick('Sinal GNSS/GSM e posição de montagem considerados','mount')}${iTick('Autorização do proprietário e instalação documentada','consent')}</div><div class="ins-alert"><strong>Conformidade e segurança:</strong> desligue a alimentação antes de intervir, proteja os circuitos, evite chicotes críticos e não acione motor, airbag, ABS ou ECU. Toda instalação real exige técnico qualificado.</div>`;
case 3:return `<h2>Esquemas de ligação e pinagem</h2><p class="hint mb16">Selecione a ligação a consultar. São diagramas funcionais, não substituem o esquema físico do chicote ou do sensor.</p><div class="ins-scheme-picker">${INSTALL_SCHEMES.map(x=>`<button class="${x.key===ins.scheme?'selected':''}" data-install-scheme="${x.key}">${esc(x.name)}</button>`).join('')}</div>${iDiagram()}<div class="card padded mt16"><div class="card-head"><h2>Pinagem do aparelho selecionado</h2></div>${iPins()}</div><div class="ins-check-grid mt16">${iTick('Conexões conferidas com o manual físico','pins')}${iTick('Montagem verificada pelo técnico habilitado','tech')}${iTick('Proteção e isolamento das conexões revisados','insulation')}</div>`;

function iExport(){const diag=Object.entries(ins.diag).map(([k,v])=>`${k}: ${v}`).join('\n');const safe={...ins.fields,apnPass:'[OMITIDA]'};return `AMBRAXIS — FICHA DE INSTALAÇÃO (DEMONSTRAÇÃO)\nNÃO COMPROVA INSTALAÇÃO REAL\nModelo: ${iModel().name}\nData: ${new Date().toLocaleDateString('pt-BR')}\n\n${Object.entries(safe).map(([k,v])=>k+': '+v).join('\n')}\n\nDIAGNÓSTICO FICTÍCIO\n${diag}\n\nManuais: ${iModel().manual}\nTraccar: https://www.traccar.org/devices/\n`}

</script><script>/* Cadastro local: sem gateway, comandos físicos ou armazenamento de senha APN. */
'use strict';
const REGISTRY_KEY='vftrack.registry.v1';
let registry=[];
let registryError='';
try {
 const saved=JSON.parse(localStorage.getItem(REGISTRY_KEY)||'[]');
 if(!Array.isArray(saved)||saved.some(r=>!r||typeof r.id!=='string'||!INSTALL_MODELS[r.model]||!r.fields||typeof r.fields.imei!=='string'))throw Error('Formato inválido');
 registry=saved.map(r=>({...r,fields:{...r.fields,apnPass:''}}));
} catch(e) {registryError='Não foi possível ler o cadastro local. Os dados existentes não serão sobrescritos.';}
function registryValidate(fields,model,records=registry) {
 if(!INSTALL_MODELS[model])return 'Selecione um modelo válido.';
 if(!fields.customer.trim()||!fields.name.trim())return 'Informe empresa e nome do rastreador.';
 if(!assets.some(a=>a.id===fields.asset))return 'Informe o ID de um ativo existente na frota.';
 if(!/^\d{15}$/.test(fields.imei))return 'Informe um IMEI com exatamente 15 dígitos.';
 if(records.some(r=>r.fields.imei===fields.imei))return 'Este IMEI já está cadastrado neste navegador.';
 if(!fields.server.trim()||/\s|:\/\//.test(fields.server))return 'Informe o servidor sem espaços ou http://.';
 if(!/^\d+$/.test(fields.port)||+fields.port<1||+fields.port>65535)return 'Informe uma porta entre 1 e 65535.';
 if(!['TCP','UDP'].includes(fields.transport))return 'Selecione TCP ou UDP.';
 return '';
}
function registrySave(){
 if(registryError){toast(registryError);return;}
 const fields=Object.fromEntries(Object.entries(ins.fields).map(([k,v])=>[k,String(v).trim()]));
 const error=registryValidate(fields,ins.model);if(error){toast(error);return;}
 fields.apnPass='';
 const record={id:'LOCAL-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),model:ins.model,fields,createdAt:new Date().toISOString()};
 const updated=[...registry,record];
 try{localStorage.setItem(REGISTRY_KEY,JSON.stringify(updated));}catch(e){toast('Não foi possível salvar. Verifique o armazenamento do navegador.');return;}
 registry=updated;ins.reported=true;toast('Rastreador salvo neste navegador. Aguardando integração com gateway.');navigate('registry');
}
function registryPage(){return head('Rastreadores salvos neste navegador','Configurações locais, sem comunicação com equipamentos. A limpeza dos dados do navegador remove estes registros.',linkBtn('Cadastrar rastreador','installation','','primary'))+
 `<div class="notice-banner">${esc(registryError||'Senha APN não é armazenada. Use apenas dados de teste neste protótipo; não há autenticação ou sincronização entre computadores.')}</div>`+
 (registry.length?tb(['Nome / IMEI','Modelo','Empresa','Ativo','Servidor','Situação'],registry.map(r=>row([cell(r.fields.name,'•••••••••••'+r.fields.imei.slice(-4)),esc(INSTALL_MODELS[r.model].name),esc(r.fields.customer),esc(r.fields.asset),esc(r.fields.server+':'+r.fields.port+' / '+r.fields.transport),badge('Não conectado')]))):'<div class="card empty">Nenhum rastreador salvo. Abra o assistente e preencha a identificação e o servidor.</div>');}
groups[0][1].splice(4,0,['registry','Cadastros locais','database']);
menuIndex.registry={title:'Cadastros locais',icon:'database'};pages.registry=registryPage;
const previousInstallationPage=pages.installation;
pages.installation=()=>previousInstallationPage()+`<div class="card padded mt16"><h2>Salvar configuração local</h2><p class="hint">Salva empresa, ativo, identificador e parâmetros neste navegador. Não ativa o rastreador e não guarda a senha APN. O diagnóstico acima continua simulado.</p><div class="btn-row"><button class="btn primary" data-registry-save>Salvar rastreador neste navegador</button>${linkBtn('Ver cadastros locais','registry')}</div></div>`;
const previousDevicesPage=pages.devices;
pages.devices=()=>`<div class="page"><div class="hero-strip"><div><strong>${registry.length} rastreador(es) salvo(s) neste navegador</strong><p>Os dispositivos abaixo são exemplos fictícios do catálogo original.</p></div>${linkBtn('Ver cadastros locais','registry','','primary')}</div></div>`+previousDevicesPage();
document.addEventListener('click',e=>{if(e.target.closest('[data-registry-save]')){e.preventDefault();registrySave();}},true);
parseHash();render();
</script><script>/* Fonte da documentação exibida em Configurações. Atualizar a cada entrega. */
'use strict';
const SYSTEM_DOCUMENTATION={
 version:'0.12.0',updated:'31/10/2026',
 sections:[
 {title:'Preparação das integrações cloud',status:'Estrutura preparada — sem publicação',text:'Preparação iniciada em 31/10/2026 para GitHub, Firebase Hosting, Google Cloud Run e Supabase Postgres.',items:['O backend continua com SQLite e autenticação própria. Não existe conexão Postgres ativa nesta etapa.','Workflow GitHub preparado para sintaxe, testes e build. Modelos de destinos e Hosting ficam em deploy; não foram vinculados a projetos.','A publicação depende da migração transacional para Postgres e da configuração de segredos, origem HTTPS e identidade de implantação. Consulte INTEGRACAO_CLOUD.md.']},
 {title:'Visão do sistema',status:'Escopo',text:'AMBRAXIS — Plataforma integrada de comando — reúne rastreamento, central de monitoramento, proteção de ativos e cargas, CFTV e gestão operacional. A versão atual combina demonstração, cadastro local e backend de desenvolvimento com contas e banco SQLite. Há uma API de recepção de posições JSON; nenhum equipamento físico foi conectado ou homologado nesta entrega.',items:['Interface em português com navegação por módulos e apresentação para desktop e celular.','Dados de frota, mapas, câmeras, contêineres e indicadores são exemplos fictícios.','ERP faz parte do escopo futuro; não há sincronização implementada.']},
 {title:'Central operacional e frota',status:'Demonstração',text:'Visão geral, mapa ao vivo, veículos e frotas, rotas, geocercas e reprodução de trajetos apresentam a organização planejada da operação.',items:['Pesquisar os ativos e abrir suas fichas pelos módulos existentes.','O mapa é ilustrativo: não recebe coordenadas de GPS nem confirma a localização atual.','Rotas, geocercas, reprodução e telemetria usam dados simulados; não executam monitoramento real.']},
 {title:'Instalação e configuração de rastreadores',status:'Assistente demonstrativo',text:'O assistente existente organiza a instalação em oito etapas: modelo, identificação, pré-instalação, ligações, SIM/APN, servidor, diagnóstico e conclusão.',items:['Abra Instalar rastreador ou o atalho do catálogo Rastreadores.','A biblioteca contém referências para FMC130 e FMB920 e um fluxo genérico para modelos que precisam de homologação.','As referências técnicas herdadas não foram revalidadas nesta continuação. Consulte o manual oficial aplicável ao modelo, firmware e chicote.','Checklist e diagnóstico são manuais e fictícios. A conclusão não comprova instalação ou conexão.','O texto de configuração pode ser visualizado/copiado; nenhum SMS ou comando é enviado. A exportação TXT omite a senha APN.','Campos do assistente permanecem em memória até o salvamento explícito do cadastro; o rascunho não é recuperado após recarga. Checklist e diagnóstico só são recuperados se registrados explicitamente no banco da empresa, conforme a seção de registros de instalação.']},
 {title:'Cadastro local de rastreadores',status:'Implementado localmente',text:'A configuração pode ser salva explicitamente no armazenamento deste navegador e consultada em Cadastros locais. Este é um cadastro de teste, sem ativação do equipamento.',items:['No assistente, preencha empresa, nome, ID de ativo existente (por exemplo VFT-001), IMEI de teste com 15 dígitos, servidor, porta e TCP ou UDP.','Clique em Salvar rastreador neste navegador. O sistema abre Cadastros locais após confirmar a gravação.','O sistema valida campos obrigatórios, vínculo do ativo, formato do IMEI, servidor sem espaços ou http://, porta de 1 a 65535 e transporte.','IMEIs repetidos nos cadastros locais são rejeitados. Não há validação do dígito verificador, titularidade ou duplicidade em plataformas externas.','Empresa, ativo, identificador e parâmetros são armazenados localmente; a senha APN é removida antes da gravação.','A lista mascara o IMEI, mas o identificador completo permanece no armazenamento local. Use apenas dados de teste.','Recarregue o mesmo endereço no mesmo navegador para recuperar os registros. Outro arquivo, perfil, computador ou origem pode ter armazenamento diferente. Limpar os dados do navegador pode apagar os registros.','Falhas de leitura ou gravação são informadas. Dados corrompidos não são sobrescritos pelo cadastro.','Não há edição, exclusão, backup ou sincronização nesta etapa. O catálogo original de dispositivos fictícios permanece separado.']},
 {title:'Conta e cadastros no servidor',status:'Implementado em desenvolvimento',text:'O servidor Node.js mantém contas, empresas, ativos, rastreadores, sessões e auditoria em SQLite. Estes registros são independentes dos exemplos e do armazenamento local do navegador.',items:['Requer Node.js 22.13 ou superior com node:sqlite. Na pasta do projeto, execute npm start e abra http://127.0.0.1:3030. Abrir o HTML avulso não inicia o backend.','Em Conta e cadastros, crie uma empresa de teste com e-mail e senha de 12 a 128 caracteres; cada nova conta cria uma empresa própria. Administradores podem cadastrar operadores na própria empresa; não há convite por e-mail ou recuperação de senha.','Cadastre um ativo com ID sem espaços e nome. Abra o assistente e selecione o ativo no painel Cadastro no banco da empresa; preencha nome, IMEI, servidor, porta e transporte e clique em Salvar na empresa.','A empresa é determinada pela sessão, não pelo nome digitado no assistente. O botão de salvamento exige um ativo da conta selecionado; o servidor também valida o vínculo.','O servidor valida modelos suportados, campos obrigatórios, IMEI numérico de 15 dígitos, servidor sem espaços ou esquema de URL, porta de 1 a 65535 e TCP/UDP. Rejeita IMEI duplicado dentro da empresa. Não verifica dígito do IMEI nem comunicação real.','Dados persistem em data/vftrack.sqlite após reiniciar o servidor. Senhas de conta usam scrypt; a senha APN não é enviada pelo cliente nem armazenada pelo servidor. Edição e inativação estão disponíveis nos cadastros da empresa. Não há exclusão, backup automático ou migração do cadastro local.','Sessões duram oito horas, com cookie HttpOnly e SameSite=Strict. Gravações autenticadas exigem token CSRF; consultas são filtradas pela empresa da sessão. Os testes verificam isolamento entre duas empresas.','O histórico da conta lista os 100 eventos mais recentes de criação de empresa, entrada, saída e cadastro de ativos e rastreadores. A tela de auditoria demonstrativa continua separada.','Servidor local por padrão em 127.0.0.1:3030. PORT e HOST alteram a escuta; COOKIE_SECURE=1 exige acesso HTTPS compatível. Não há configuração de hospedagem ou TLS incluída. Use dados de teste.','GPS, mapas e vídeo permanecem simulados; um rastreador cadastrado aparece como Não conectado. A API JSON de posições está disponível; não há gateway nativo de protocolos, envio de SMS ou comandos físicos.']},
 {title:'Gestão de ativos e rastreadores',status:'Implementado no servidor — 0.4.0',text:'Conta e cadastros permite pesquisar, editar e inativar registros da empresa. A migração aditiva para a versão 2 do banco preserva cadastros existentes.',items:['Ativos têm ID imutável, nome, placa brasileira opcional, tipo (veículo, contêiner ou equipamento) e situação ativo/inativo. A placa aceita os formatos ABC1234, ABC-1234 e ABC1D23; a validação verifica formato, não titularidade.','Use Editar na lista de ativos, altere os campos e clique em Salvar alterações. Cancelar descarta a edição. Não é permitido inativar um ativo com rastreadores ativos: transfira ou inative esses rastreadores primeiro.','A pesquisa filtra as listas por nome, ID de ativo, placa ou IMEI conforme os campos de cada lista. Envie o campo vazio para voltar a todos os registros. O IMEI da listagem permanece mascarado.','Em rastreadores, Editar / transferir abre o assistente com os dados gravados. Altere a identificação ou configuração, selecione o ativo e a situação no painel do banco e clique em Salvar na empresa. Cancelar edição descarta as alterações.','Abrir assistente para novo rastreador inicia outro cadastro, sem substituir o registro anteriormente editado. Alterações não são salvas automaticamente.','Rastreadores ativos só podem ser vinculados a ativos ativos da mesma empresa. Um rastreador inativo pode permanecer associado ao ativo inativo; reativá-lo exige um ativo ativo. Duplicidade de IMEI continua impedida na empresa, inclusive entre registros inativos.','A auditoria grava os valores anteriores e novos dos ativos e os vínculos anterior e novo e situação dos rastreadores. A interface mostra as últimas 100 ocorrências e as transferências; não há tela de consulta de todo o histórico ou diferenças dos demais parâmetros do rastreador.','A edição exige a sessão e o token CSRF e aplica o filtro de empresa no servidor. Inativação é administrativa: não bloqueia fisicamente o veículo e não envia comandos ao rastreador.','Persistência em SQLite; não há exclusão definitiva. Cadastros locais e frota demonstrativa permanecem separados. Diagnósticos e checklists podem ser registrados explicitamente conforme a seção de registros de instalação.']},
 {title:'Registros de instalação',status:'Implementado no servidor — 0.5.0',text:'Checklists e diagnósticos manuais podem ser registrados no banco da empresa com histórico preservado. Não há leitura de equipamento nem certificação automática de instalação.',items:['Salve primeiro o rastreador em Conta e cadastros. Use Editar / transferir, preencha os checklists e diagnósticos do assistente e, no painel do banco, informe as observações e clique em Salvar novo registro de instalação. O salvamento do cadastro do rastreador não salva automaticamente o checklist.','Cada envio cria um novo registro com rastreador, ativo e modelo vigentes, autor da sessão, horário do servidor, 17 itens do checklist, seis diagnósticos e observações. Registros anteriores são preservados; não há edição ou exclusão de registros de instalação.','Os checklists aceitam booleanos e os diagnósticos aceitam Pendente, Aprovado, Falhou ou Não aplicável. Observações são limitadas a 2000 caracteres. É permitido registrar itens pendentes ou falhos: salvar não equivale a aprovar.','Antes de salvar o registro, persista alterações no vínculo ou modelo do rastreador; o servidor rejeita divergências desses campos. O registro não inclui toda a configuração do aparelho, nome do técnico, medições ou anexos. O autor interno é o usuário autenticado.','Na conta, abra Registros de instalação para consultar os itens, diagnósticos e observações. Ao editar o rastreador, o assistente recupera o último registro correspondente ao ativo e modelo atuais; ao iniciar outro cadastro, os checklists e diagnósticos são limpos.','Históricos de ativos e modelos anteriores permanecem disponíveis na conta após uma transferência. A tela lista todos os registros da empresa, sem paginação ou exportação específica nesta etapa.','Registros persistem em SQLite, com migração aditiva para a versão 3 do banco. Leituras são filtradas por empresa; gravações exigem sessão e CSRF e geram um evento installation.recorded na auditoria.','No HTML avulso e nos cadastros locais, os checklists continuam em memória. O botão Concluir demonstração e a exportação TXT não gravam no servidor. Não há validação física, GPS, sensores ou assinatura de aceite implementados.']},
 {title:'Equipe e permissões de acesso',status:'Implementado no servidor — 0.6.0',text:'Cada empresa pode ter seu administrador e operadores. As permissões são verificadas no servidor para consultas e gravações autenticadas, independentemente dos controles visuais.',items:['Entre como administrador em Conta e cadastros e use Equipe da empresa para cadastrar um operador com e-mail e senha inicial de 12 a 128 caracteres. O cadastro é feito na empresa da sessão; o cliente não escolhe outra empresa.','O perfil administrador mantém os cadastros de ativos e rastreadores, consulta informações da empresa, registra checklists e gerencia operadores. Nesta etapa, a criação pública de empresa gera um administrador; não há criação ou alteração de outros administradores pela equipe.','O operador consulta ativos, rastreadores, registros de instalação e auditoria da própria empresa e pode registrar novos checklists. Não pode criar, editar ou inativar ativos/rastreadores, listar a equipe ou criar e alterar usuários.','Para registrar checklist como operador, use Consultar / checklist no rastreador. O botão Salvar na empresa fica desabilitado: apenas Salvar novo registro de instalação está autorizado. Campos demonstrativos do assistente podem ser alterados em memória; isso não altera o cadastro.','Use Inativar ou Reativar na equipe para mudar a situação de um operador. A alteração invalida todas as suas sessões. O usuário inativo não consegue entrar e a reativação exige novo login; sessões antigas não são restauradas. Administradores não podem ser inativados por esta tela.','Os e-mails são únicos em todo o banco, inclusive entre empresas. Senhas usam scrypt e não são devolvidas na API de usuários, nem registradas nos eventos da equipe. A resposta de e-mail duplicado é genérica.','Criação de operador e alterações de situação geram eventos na auditoria. O banco recebe migração aditiva para versão 4, mantendo usuários existentes ativos. A lista da equipe mostra apenas e-mail, perfil e situação.','Há troca da própria senha mediante senha atual. Não há envio de convite, recuperação de senha, expiração de senha inicial, MFA ou perfis personalizados. O administrador define a senha inicial e deve combinar seu acesso com o operador fora do sistema. Nenhuma mensagem é enviada automaticamente.','As permissões abrangem o backend implementado; os módulos demonstrativos, inclusive as telas originais de usuários e permissões, continuam ilustrativos. Esta entrega não configura HTTPS, hospedagem ou backups de produção.']},
 {title:'Troca da própria senha',status:'Implementado no servidor — 0.7.0',text:'Administradores e operadores podem alterar a própria senha em Conta e cadastros, no painel Alterar minha senha.',items:['Informe a senha atual, uma nova senha de 12 a 128 caracteres e a confirmação. A nova senha deve ser diferente da atual. Clique em Alterar senha e sair.','A operação exige sessão válida, token CSRF e verificação da senha atual no servidor. O usuário e a empresa são definidos pela sessão; parâmetros de outra conta não alteram o destinatário da troca.','Após o sucesso, todas as sessões do usuário são removidas, inclusive a usada na alteração, e o formulário de entrada é exibido. Entre novamente com a nova senha. As sessões de outros usuários não são encerradas.','A senha usa scrypt com novo salt e persiste no banco existente. Um evento user.password_changed é gravado sem as senhas ou seus hashes. Não há alteração da versão do esquema do banco nesta entrega.','A API limita a dez tentativas de troca por usuário em quinze minutos, contadas inclusive quando a validação falha. Esse limite é mantido na memória do servidor e é reiniciado ao reiniciar o processo.','A gravação revalida a sessão e a senha armazenada depois do cálculo assíncrono para evitar substituição por uma troca concorrente. O login também revalida se a credencial mudou durante sua verificação.','Não há recuperação de senha esquecida, redefinição por administrador, envio de e-mail, expiração obrigatória da senha inicial ou MFA nesta etapa. O HTML avulso não oferece troca de senha sem servidor.']},
 {title:'Cópia de segurança e restauração',status:'Implementado por comandos locais — 0.8.0',text:'Ferramentas locais permitem copiar, verificar e restaurar o banco completo. Não há download do banco, acesso ao backup pela API ou agendamento automático.',items:['Pare o servidor antes da manutenção. Na pasta do projeto, execute npm run db:backup -- backups/vftrack-data.sqlite. O destino deve ser novo: arquivos existentes não são sobrescritos. A ferramenta aceita esquemas 4, 5 e 6. O servidor migra o banco para o esquema 6.','Para verificar um arquivo, execute npm run db:verify -- backups/vftrack-data.sqlite. A ferramenta verifica integridade SQLite, versão do esquema, colunas obrigatórias e chaves estrangeiras. Isso não autentica a origem do arquivo nem certifica a validade operacional dos dados.','Para restaurar, mantenha o servidor parado e execute npm run db:restore -- backups/vftrack-data.sqlite --confirm. O comando substitui data/vftrack.sqlite e cria, ao lado dele, uma cópia anterior com o sufixo before-restore e identificador único. Sem --confirm, nenhuma restauração é feita.','O backup inclui todas as empresas, contas com hashes de senha, ativos, rastreadores, auditoria e instalações; não é exportação de uma empresa isolada. Sessões e credenciais GPS são removidas das cópias; a cópia do banco anterior também omite sessões. Após restaurar, entre novamente com as credenciais de conta contidas no backup e gere uma nova credencial de integração GPS.','Os arquivos criados têm permissões locais 0600. O backup não é criptografado: mantenha-o em armazenamento protegido. Não há retenção automática, sincronização externa, senha de arquivo ou armazenamento em nuvem nesta etapa.','Um bloqueio ao lado do banco impede abrir outro servidor ou executar manutenção simultânea pelos comandos do projeto. Não protege contra programas externos que ignorem o bloqueio. A saída normal por Ctrl+C ou SIGTERM encerra o banco e libera o bloqueio.','Se houver encerramento forçado ou falha do computador, pode permanecer data/vftrack.sqlite.lock. Confirme que nenhum processo AMBRAXIS ou manutenção está usando o banco antes de remover manualmente somente esse arquivo de bloqueio. Não remova arquivos -wal ou -shm manualmente.','A cópia usa snapshot SQLite, é validada antes da publicação e não altera as sessões do banco original. Na restauração, a troca é feita com arquivo temporário no mesmo diretório e cópia anterior preservada. Não há garantia de recuperação automática após falha de energia; confira as cópias antes de remover qualquer arquivo.','Os comandos funcionam apenas no ambiente local com acesso ao sistema de arquivos. Não há evento de auditoria web para manutenção offline e o arquivo HTML avulso não faz backup. Testes usam bancos temporários; nenhum banco de uso real foi restaurado nesta entrega.']},
 {title:'Recepção de posições GPS',status:'API e consulta implementadas — 0.10.0',text:'Posições recebidas mostra dados persistidos pela API JSON de integração. Não há decodificador TCP/UDP, conexão nativa com Traccar ou equipamento físico homologado nesta entrega.',items:['Cadastre o ativo e o rastreador na empresa. Como administrador, abra Posições recebidas e gere uma credencial de integração. Copie-a no momento da geração: somente seu hash é gravado no banco; a credencial completa fica na memória da página até sair ou recarregar.','O integrador envia POST /api/gps/ingest com Authorization: Bearer e JSON contendo imei, latitude, longitude e recordedAt. Consulte INTEGRACAO_GPS.md para contrato e exemplo. O token define a empresa; campos de empresa no corpo não mudam o destinatário.','São aceitos IMEI textual com 15 dígitos, latitude numérica de -90 a 90, longitude de -180 a 180, recordedAt UTC canônico com milissegundos e Z, velocidade opcional de 0 a 500 km/h e ignição booleana opcional. Horários mais de cinco minutos no futuro são rejeitados.','Só recebem posições rastreadores ativos associados a ativos ativos da empresa. O ativo no evento é preservado mesmo se o rastreador for transferido depois. Posições com mesmo rastreador e horário são rejeitadas com 409; não há sobrescrita.','A tela exibe a última posição por horário GPS, não pela ordem de chegada, e até 100 posições mais recentes por rastreador. Mostra horário GPS e recebimento separadamente e oferece link para visualizar as coordenadas no OpenStreetMap externo.','A consulta é permitida a administradores e operadores da empresa; apenas administradores geram ou revogam credenciais. Substituir ou revogar uma credencial interrompe o uso da anterior. Tokens não são gravados em auditoria ou armazenamento do navegador.','A recepção limita cada empresa a 600 tentativas autenticadas por minuto, com contador em memória. Não há autenticação individual do equipamento ou assinatura por posição: a credencial autoriza um integrador para os rastreadores da empresa. Proteja-a e use HTTPS fora do ambiente local.','Atualizar posições consulta o servidor manualmente; a atualização automática a cada 15 segundos pode ser ativada nesta tela. Geocercas operacionais calcula eventos circulares a partir das posições recebidas. Não há alerta de perda de comunicação, reprodução de percurso ou mapa integrado de posições nesta etapa. O mapa demonstrativo continua separado. Não se presume online com base em um único envio.','O banco migra para esquema 5. Backups preservam posições, mas removem credenciais GPS e sessões; depois de restaurar, gere outro token. Não há retenção ou expurgo automático de posições e o histórico da API é limitado às 100 mais recentes.','Seis testes automatizados cobrem recepção, validações, isolamento, ordenação temporal, revogação, persistência e backup sem token. Nenhum gateway externo ou rastreador físico foi usado; não houve inspeção visual no navegador.']},
 {title:'Acompanhamento de posições e exportação',status:'Implementado na interface — 0.11.0',text:'Posições recebidas permite filtrar rastreadores, acompanhar a idade da medição e exportar os registros do histórico aberto. Não há nova conexão de equipamento ou alteração de esquema do banco.',items:['Use Rastreador / ativo atual e Atualidade da posição, depois Aplicar filtros. O seletor identifica o ativo vinculado atualmente ao rastreador; a coluna Ativo no evento mantém o vínculo histórico do momento em que a posição chegou.','Recente indica medição de até cinco minutos; Atrasada indica mais de cinco minutos. Horário futuro é exibido separadamente para datas posteriores ao relógio do navegador. Sem posição identifica rastreadores cadastrados que ainda não têm nenhum envio. Esses rótulos não certificam estado online ou veículo parado.','A idade usa o horário GPS, não o horário de chegada do pacote. Um pacote antigo recebido agora permanece atrasado. A classificação depende do relógio do navegador; não há parametrização do limite de cinco minutos nesta etapa.','Ative Atualizar a cada 15 segundos nesta tela para consultar automaticamente últimas posições e o histórico aberto. A consulta é suspensa em outra tela, com aba oculta, operação de cadastro em andamento ou usuário desconectado. Não há atualização em segundo plano ou notificações.','O horário de última consulta só avança quando as consultas são concluídas. Falhas são informadas, mantendo os últimos dados disponíveis e seu horário de atualização. Uma resposta da consulta GPS não é aplicada depois de encerrar a sessão ou trocar seu token CSRF.','Abra Histórico e use Exportar histórico CSV. O arquivo contém no máximo as 100 posições mais recentes carregadas para aquele rastreador, em ordem decrescente de horário GPS; não é uma exportação completa do banco nem de todos os trajetos.','O CSV usa UTF-8 com BOM e separador ponto e vírgula, com horários UTC, coordenadas, velocidade e ignição. Textos que poderiam iniciar fórmulas recebem prefixo de apóstrofo. A exportação usa dados já consultados pela sessão da empresa e não inclui IMEI ou credenciais GPS.','Filtros, opção automática e histórico aberto ficam em memória até sair ou recarregar; o CSV é um arquivo baixado pelo navegador. As posições continuam persistidas em SQLite. Nenhuma posição fictícia é inserida para demonstrar esta tela.','Sete testes automatizados verificam cadastros, recepção, backup, filtros básicos, classificação temporal, proteção de CSV, consulta sem sobreposição e rejeição de resposta após logout. Não houve inspeção visual no navegador ou teste físico de GPS.']},
 {title:'Geocercas operacionais e eventos',status:'Implementado no servidor — 0.12.0',text:'Geocercas circulares geram eventos persistentes de entrada e saída com base nas posições da API. A implementação é separada das telas demonstrativas de geocercas e central de alertas.',items:['Como administrador, abra Geocercas operacionais, informe nome, ativo ativo da empresa, latitude/longitude decimais do centro e raio de 50 a 100000 metros. Clique em Cadastrar geocerca. Não há desenho no mapa ou edição do centro/raio: inative a cerca antiga e crie outra.','A distância é calculada por aproximação esférica de Haversine com raio terrestre de 6371000 metros; pontos na borda são considerados dentro. Não há polígonos, margem anti-oscilação, validação de precisão GPS ou filtro de localização falsa.','A primeira posição elegível estabelece a referência dentro/fora e não cria evento. Uma nova posição que mude de lado gera Entrada ou Saída. Estado e evento são gravados na mesma transação da posição. Não há inferência do ponto ou horário exato da travessia entre medições.','Posições fora de ordem continuam no histórico, mas não retrocedem o estado nem geram transições atrasadas: só são avaliadas as que não têm posição posterior já registrada para o mesmo rastreador. Não há reprocessamento de trajetos anteriores.','A avaliação é por geocerca e rastreador associado ao ativo. Dois rastreadores no mesmo ativo podem gerar eventos separados. Alterar a situação da cerca, alterar a situação do ativo ou do rastreador ou transferir o rastreador limpa a referência correspondente; a próxima posição elegível estabelece nova referência sem evento.','Administradores e operadores consultam os 100 eventos mais recentes e podem Reconhecer. O reconhecimento persiste autor interno e horário, é idempotente e gera auditoria somente no primeiro atendimento. Não há encerramento, atribuição de responsável, comentários ou reabertura nesta etapa.','Use Atualizar geocercas e eventos para consultar os dados atuais; não há atualização automática nesta tela. A tabela mostra horário GPS e horário de registro do evento, nome da cerca, ativo e rastreador.','As APIs exigem sessão e isolamento por empresa; gravações exigem CSRF. Somente administradores criam ou ativam/inativam geocercas. Criação e mudanças de situação também são auditadas. O cadastro não aceita ativo de outra empresa.','O banco migra de forma aditiva para esquema 6. Backups e restauração preservam geocercas, estados e eventos; as ferramentas aceitam esquemas 4, 5 e 6 e continuam removendo sessões e credenciais GPS das cópias. Não há retenção automática ou exclusão definitiva de geocercas.','Não há SMS, e-mail, envio a equipe, bloqueio físico ou alerta de falta de sinal. A existência de um evento não certifica comunicação com equipamento real: as posições podem ser enviadas por um integrador de teste. Nenhum rastreador físico foi homologado nesta entrega.','Oito testes automatizados passaram, cobrindo distância, transições, baseline, persistência após reinício, atraso, inativação/reativação, transferência, CSRF, isolamento e reconhecimento idempotente, além das regressões existentes. Sem inspeção visual no navegador.']},
 {title:'Antifurto, SOS e central de alertas',status:'Simulação',text:'O módulo permite experimentar proteção armada/desarmada, violação e acionamento manual de SOS por ativo, com ocorrências e linha do tempo da sessão.',items:['Selecione o ativo em Antifurto e SOS e use as ações disponíveis para explorar o atendimento.','Reconhecimento e encerramento ilustram o fluxo operacional. Eventos gerados podem aparecer na central de alertas.','Não existe bloqueio físico, acionamento de equipe, aviso externo ou integração com botão de pânico real.','Ocorrências simuladas não possuem persistência ou auditoria de produção.']},
 {title:'Contêineres, lacres e autorizações',status:'Demonstração',text:'As telas mostram estado de portas, integridade de lacres, bateria, risco e exemplos de abertura fora de zona autorizada.',items:['Explore Contêineres, Lacres e sensores, Autorizações de abertura e Central de alertas.','Os estados são fictícios; não há ingestão de sensores, controle remoto de lacres ou emissão de autorização operacional.','O desenvolvimento real precisa associar sensor, ativo, empresa e horário do evento.']},
 {title:'CFTV e vídeo',status:'Demonstração',text:'Videowall e Câmeras e NVRs mostram a experiência planejada para câmeras fixas e embarcadas.',items:['As imagens são ilustrações, sem transmissão, gravação ou reprodução de vídeo real.','A associação futura entre vídeo e GPS depende de identificação do ativo e sincronização de horários.','Integrações com gateways de mídia, RTSP/ONVIF e MDVR ainda não foram implementadas.']},
 {title:'Gestão, inteligência e configurações',status:'Demonstração',text:'Clientes, planos, usuários, relatórios, telemetria, inteligência territorial, auditoria e integrações representam o escopo visual da plataforma.',items:['O copiloto usa respostas locais predefinidas; não está conectado a um modelo de IA.','Formulários genéricos apenas simulam confirmação; não criam registros persistentes. As exceções são os cadastros explícitos locais e os de Conta e cadastros descritos neste documento.','Preferências de Configurações são visuais ou mantidas na sessão; Simular salvamento não grava em servidor.','As opções de MFA, autorização dupla e permissões não aplicam controles de acesso reais.','A documentação nesta página acompanha os arquivos da versão; não pode ser editada pela interface.']},
 {title:'Evolução para operação real',status:'Pendente',text:'A próxima fase exige uma base de serviços que substitua os dados demonstrativos por informações autenticadas e rastreáveis.',items:['Evoluir o backend de desenvolvimento para implantação: HTTPS, recuperação de conta, ampliação dos perfis, backup e operação supervisionada.','Cadastro centralizado, gestão de segredos e integração com gateway GPS.','Recepção de telemetria, alarmes de contêiner e eventos reais de antifurto.','Gateway de mídia, vínculos de câmeras, gravação e permissões de vídeo.','Definição e implementação do contrato de integração com ERP.','Testes de equipamentos, homologação dos modelos e validação operacional.']},
 {title:'Histórico de implementação e validação',status:'Atualizado em 31/10/2026',text:'Registro das entregas recuperadas e das alterações desta continuação.',items:['Base recebida: demonstração navegável e pacote de instalação, com assistente, biblioteca, antifurto e SOS já presentes.','Etapa 0.1: cadastro local de rastreadores, validação de campos e duplicidade, senha APN excluída e tratamento de falhas de armazenamento.','Etapa 0.12.0: geocercas circulares por ativo, avaliação transacional, eventos persistentes de entrada/saída, reconhecimento e auditoria; baseline e rejeição de transições com posições fora de ordem. Migração para esquema 6, backups compatíveis e oito testes automatizados. Sem validação visual ou equipamento físico.', 'Etapa 0.11.0: filtros, identificação de rastreadores sem posição, atualidade pelo horário GPS, atualização opcional de 15 segundos e exportação CSV do histórico limitado a 100 posições. Sete testes automatizados, sintaxe e artefatos verificados; sem inspeção visual ou conexão de equipamento.', 'Etapa 0.10.0: API JSON autenticada para posições, tokens por empresa, última posição e histórico, links externos de mapa, validações e migração aditiva para esquema 5. Backup compatível com esquemas 4/5 e exclusão dos tokens das cópias. Testes e sintaxe validados; sem integração física homologada.', 'Etapa 0.9.0: plataforma renomeada para AMBRAXIS, com assinatura Plataforma integrada de comando. Identidade atualizada na navegação, título, textos, manual e HTML avulso AMBRAXIS.html. Nome técnico do banco, chave de armazenamento e cookies preservados para compatibilidade. Sem novas integrações operacionais nesta entrega.', 'Etapa 0.8.0: backup, verificação e restauração local do banco; cópia anterior preservada, sessões excluídas das cópias, permissões 0600, bloqueio de manutenção concorrente e encerramento normal liberando o banco. Cinco testes automatizados, sintaxe, geração do manual/HTML e integridade do ZIP; sem inspeção visual ou restau ransferir':'Consultar / checklist')]))):'<div class="empty">Nenhum rastreador cadastrado nesta empresa.</div>')+'</div>'+passwordMarkup()+teamMarkup()+installationHistoryMarkup()+'<div class="mt16">'+panel('Histórico da empresa (100 eventos mais recentes)',backend.audit.map(a=>`<div class="list-line"><span>${esc(new Date(a.created_at).toLocaleString('pt-BR'))} · ${esc(({'company.created':'Empresa criada','session.started':'Entrada na conta','session.ended':'Saída da conta','asset.created':'Ativo cadastrado','asset.updated':'Ativo alterado','device.created':'Rastreador cadastrado','device.updated':'Rastreador alterado','installation.recorded':'Checklist registrado','geofence.created':'Geocerca criada','geofence.status_changed':'Situação de geocerca alterada','geofence.event_acknowledged':'Evento reconhecido','gps.token_rotated':'Credencial GPS substituída','gps.token_revoked':'Credencial GPS revogada','user.password_changed':'Senha alterada','user.created':'Operador criado','user.status_changed':'Situação de usuário alterada'})[a.action]||a.action)} · ${esc(a.entity_id)}${a.action.startsWith('device.')?` · ${esc(JSON.parse(a.details||'{}').previousAsset||'Sem vínculo anterior')} → ${esc(JSON.parse(a.details||'{}').asset||'—')}`:''}</span></div>`).join(''))+'</div>';
